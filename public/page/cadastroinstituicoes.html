<body id="pagina">
  <div class="container" id="entrada_comentario" style="border: 4px solid #17375F;">
    <!-- <p style="text-align: center !important;" id="entreda_comentario_textos">Você pode compartilhar sua história de
            forma anônima - o nome é opcional e apelidos são bem-vindos!
        </p> -->
    <h5 id="info-cadastro-prof">Atenção!</h5>
    <p id="obrigatorio"> 

        
    </p>
    <div class="mb-3">
      <label for="nome" class="form-label" id="entreda_comentario_textos">Nome</label>
      <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
    </div>
    <div class="mb-3">

      <label for="Formação" class="form-label" id="entreda_comentario_textos">Formação</label>
      <input type="text" class="form-control" id="formacao" placeholder="Formação">
      <p id="alert"></p>
    </div>
    <div class="mb-3">

      <label for="faculdade" class="form-label" id="entreda_comentario_textos">Faculdade</label>
      <input type="text" class="form-control" id="faculdade" placeholder="faculdade">
      <p id="alert"></p>
    </div>
    <div class="mb-3">

      <label for="cpf" class="form-label" id="entreda_comentario_textos">CPF</label>
      <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
      <p id="alert"></p>
    </div>
    <div class="mb-3">

      <label for="crm_crp" class="form-label" id="entreda_comentario_textos">CRP/CRP</label>
      <input type="text" class="form-control" id="crm_crp" placeholder="CRP/CRP">
      <p id="alert"></p>
    </div>
    <div class="mb-3">

      <label for="cidade" class="form-label" id="entreda_comentario_textos">Cidade</label>
      <input type="text" class="form-control" id="cidade" placeholder="Cidade">
      <p id="alert"></p>
    </div>
    <div class="mb-3">

      <label for="estado" class="form-label" id="entreda_comentario_textos">Estado</label>
      <input type="text" class="form-control" id="estado" placeholder="Estado">
      <p id="alert"></p>
    </div>
    <div class="mb-3">
      <label for="logradouro" class="form-label" id="entreda_comentario_textos">logradouro </label>
      <input type="text" class="form-control" id="logradouro" placeholder="logradouro">
      <p id="alert"></p>
    </div>
    <div class="mb-3">
      <label for="resumo" class="form-label" id="entreda_comentario_textos">Experiência</label>
      <textarea class="form-control" id="resumo" rows="3"
        placeholder="Divida suas experiências com a gente..."></textarea>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label" id="entreda_comentario_textos">E-mail</label>
      <input type="text" class="form-control" id="email" placeholder="email">
      <p id="alert"></p>
    </div>
    <div class="mb-3">
      <label for="inputPassword5" class="form-label" id="entreda_comentario_textos">Digite sua senha</label>
      <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
    </div>

    <div id="passwordHelpBlock" class="form-text">
      Sua senha deve ter entre 8 e 20 caracteres, conter letras e números e não deve conter espaços,
      caracteres especiais ou emojis.
    </div>
    <br>

    <div class="was-validated">
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="aceitar-uso" required>
        <label class="form-check-label" for="aceitar-uso">Aceitar termos de uso - Para saber mais <a
            href="termosdeusoprofi.html">clique aqui</a></label>
      </div>

    </div>
    <br>
    <button type="button" class="btn btn-primary" id="btnPublicar">Cadastrar</button>

  </div>
  <script type="module" src="../assents/js/receber-cadastro.js"></script>
  <script src="../assents/js/motor-busca.js"></script>
